<!-- MobileLanter Footer -->
{{ $mobilelanter := resources.Get "js/mobilelanter.js" | js.Build }}
<script type="module" src="{{ $mobilelanter.RelPermalink }}" defer></script>

<footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 mt-auto">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex flex-col sm:flex-row justify-between items-center space-y-3 sm:space-y-0">
      <!-- Theme Toggle Group -->
      <div class="flex items-center space-x-4">
        <div id="theme-toggle-group" class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-md p-1">
          <button data-theme="light" class="flex items-center px-2 py-1 text-xs font-medium rounded transition-colors">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            {{ i18n "theme_light" }}
          </button>
          <button data-theme="dark" class="flex items-center px-2 py-1 text-xs font-medium rounded transition-colors">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            {{ i18n "theme_dark" }}
          </button>
          <button data-theme="auto" class="flex items-center px-2 py-1 text-xs font-medium rounded transition-colors">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            {{ i18n "theme_auto" }}
          </button>
        </div>
      </div>

      <!-- Keyboard Shortcuts -->
      <div class="flex items-center text-xs text-slate-500 dark:text-slate-400">
        <div class="flex items-center space-x-1">
          <kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-800 rounded text-xs font-mono">⌘T</kbd>
          <span>{{ i18n "shortcut_theme" }}</span>
        </div>
      </div>
    </div>
  </div>
</footer>
